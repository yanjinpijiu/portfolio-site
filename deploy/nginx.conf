# /etc/nginx/conf.d/qianlink.conf
#
# 前端静态文件由 nginx 直接发，/api 反向代理到本机 8080 的后端。
# 首次部署先用这份（只有 80 端口），跑完 certbot 后 nginx 配置会被改写，
# 之后以服务器上的那份为准。

# 后台登录限流：单 IP 每分钟 20 次。不是防暴力破解（密钥 32 位随机，
# 破解本来就没戏），主要是别让脚本把日志刷爆、把单核 CPU 打满。
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=20r/m;
limit_req_status 429;

server {
    # 故意不写 listen [::]:80：部分镜像/机房没开 IPv6，绑不上会导致 nginx 直接起不来
    listen 80;
    # me. 这个子域是简历上「通过Web了解我」指过去的地址，必须在这里列出来，
    # 否则签 HTTPS 时证书不覆盖它，HR 用 https://me.qianlink.top 打开会报证书错误
    server_name qianlink.top www.qianlink.top me.qianlink.top;

    root /var/www/qianlink;
    index index.html;

    charset utf-8;

    # 和后端 spring.servlet.multipart.max-file-size 保持一致，
    # 小于这个值的限制会先被 nginx 拦掉，表现为上传大 PDF 失败
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    access_log /var/log/nginx/qianlink.access.log;
    error_log  /var/log/nginx/qianlink.error.log;

    # 这几个 proxy_ 指令写在 server 层，由下面两个 location 继承，
    # 免得同一堆头写两遍写歪了
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Vite 产物带内容哈希，文件名变了内容才会变，可以放心长缓存。
    # 只用 add_header，不叠加 expires —— 两个都写会吐出两条 Cache-Control 头
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 静态模式的内容快照：由后台「切到静态」时生成，会重新生成所以别长缓存。
    # 这个文件只在静态模式下存在，动态模式下请求它会落到下面的 SPA 回退（返回 index.html），
    # 但动态模式的前端根本不会去请求它
    location = /snapshot.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html 绝对不能缓存，否则发新版后老用户一直拿到旧的（引用的静态资源哈希已失效）。
    # 另外静态模式下后端会往这个文件里插一行 window.__SITE_MODE__="static"，
    # 所以它必须是「每次都问服务端」的，不然切了模式老用户还在走旧的
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 上传的图片、头像、证书：直接由 nginx 从磁盘发改写，不经过 Java。
    # 后端也有一份 /files/**（FileController），那是给没有 nginx 的开发环境用的；
    # 线上这份走静态，省掉一次进程转发，图片这种小文件密集请求差别很明显。
    # 目录和 LocalStorageService 的落盘目录（app.storage.local.dir）是同一个。
    location /files/ {
        alias /opt/portfolio/data/files/;
        # key 里含 uuid，内容不会变，可以长缓存
        add_header Cache-Control "public, max-age=2592000" always;
        # 关掉目录列表，避免有人翻出没被引用的文件
        autoindex off;
        try_files $uri =404;
    }

    # 登录接口单独拎出来限流。带 = 是精确匹配，优先级高于下面的 /api/ 前缀匹配，
    # 所以写在 /api/ 后面也没关系
    location = /api/admin/login {
        limit_req zone=adminlogin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    # 其余后端接口。
    # 端口 8090 不是随便挑的：这台机器上 RocketMQ 的 broker 容器一次性映射了
    # 8080-8082（proxy 用的就是这三个），撞上去会起不来。
    # 改这里的话，/opt/portfolio/portfolio.env 里的 SERVER_PORT 要一起改。
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
    }

    # 前端 history 路由：/projects/xxx 这种路径磁盘上没有对应文件，
    # 必须回退到 index.html 交给 vue-router，否则刷新页面直接 404。
    # 回退目标是 /index.html 这个 URI，会再走上面那个 location，于是同样能命中静态入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
